name: 9ROUND requested shifts November 25 and 26
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anauts-soga-shift-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read requested shifts using existing owner credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: node scripts/soga-shift-20261125-26.mjs
