name: GAS Deploy MPG Shifts (safe)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_MPG_SHIFTS to update live Apps Script source"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "DEPLOY_MPG_SHIFTS" || (echo "Confirmation mismatch. Deployment cancelled." && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON is missing" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON is missing" && exit 1)

      - name: Prepare clasp credentials and isolated live snapshot
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          rm -rf .gas-live
          mkdir -p .gas-live
          node -e 'const fs=require("fs"); const cfg=JSON.parse(process.env.CLASP_JSON); if(!cfg.scriptId) throw new Error("CLASP_JSON.scriptId is missing"); fs.writeFileSync(".clasp.json", JSON.stringify({scriptId:cfg.scriptId,rootDir:".gas-live"}));'
          printf '%s\n' 'node_modules/**' '.github/**' > .claspignore

      - name: Pull current live Apps Script source
        run: npx -y @google/clasp@3.4.1 pull

      - name: Overlay MPG shift automation
        run: |
          test -f .gas-live/24_StaffShift.gs.js || (echo "Live 24_StaffShift.js was not pulled" && exit 1)
          test -f .gas-live/28_Availability.gs.js || (echo "Live 28_Availability.js was not pulled" && exit 1)
          test -f .gas-live/29_Reservation.gs.js || (echo "Live 29_Reservation.js was not pulled" && exit 1)
          test -f .gas-live/99_Main.js || (echo "Live 99_Main.js was not pulled" && exit 1)
          cp gas/63_MpgShiftRules.gs .gas-live/63_MpgShiftRules.js
          node scripts/gas-mpg-shift-overlay.mjs

      - name: Verify MPG overlay
        run: |
          grep -q 'function generateKawakamiMpgShifts' .gas-live/63_MpgShiftRules.js
          grep -q 'MPG_SHIFT_TRAVEL_MINUTES_ = 150' .gas-live/63_MpgShiftRules.js
          grep -q 'MPG_SHIFT_UNRESERVED_CUTOFF_HOURS_ = 48' .gas-live/63_MpgShiftRules.js
          grep -q 'mpgAssertIncomingShiftCanReplaceMpg_' .gas-live/24_StaffShift.gs.js
          grep -q 'service.store_code' .gas-live/28_Availability.gs.js
          grep -q 'service.store_code' .gas-live/29_Reservation.gs.js
          grep -q 'case "generateKawakamiMpgShifts"' .gas-live/99_Main.js
          echo "MPG shift overlay verified."

      - name: Push preserved live source plus MPG changes
        run: npx -y @google/clasp@3.4.1 push --force

      - name: Update the existing web-app deployment
        shell: bash
        run: |
          DEPLOYMENT_ID="$(node - <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("assets/js/reserve.js", "utf8");
          const match = src.match(/script\.google\.com\/macros\/s\/([^/]+)\/exec/);
          if (!match) throw new Error("Could not resolve the current web-app deployment ID");
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$DEPLOYMENT_ID" || (echo "Deployment ID is empty" && exit 1)
          npx -y @google/clasp@3.4.1 update-deployment "$DEPLOYMENT_ID" -d "MPG Kawakami shift automation"
