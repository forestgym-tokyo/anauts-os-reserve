name: TFG settlement policy release
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verify live source or deploy the reviewed settlement fix
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
permissions:
  contents: read
concurrency:
  group: anauts-main-gas-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify regressions
        run: node --test --test-reporter=tap tests/*.test.js
      - name: Preserve production source and verify or deploy the settlement patch
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          RELEASE_PHASE: ${{ inputs.phase }}
        run: node scripts/tfg-settlement-gas-release.mjs "$RELEASE_PHASE"
