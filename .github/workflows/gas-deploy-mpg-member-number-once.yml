name: GAS Deploy MPG Member Number (one-time safe)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gas-deploy-mpg-member-number-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON is missing" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON is missing" && exit 1)

      - name: Pull current live Apps Script source
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        shell: bash
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          rm -rf .gas-live
          mkdir -p .gas-live
          node -e 'const fs=require("fs"); const cfg=JSON.parse(process.env.CLASP_JSON); if(!cfg.scriptId) throw new Error("CLASP_JSON.scriptId is missing"); fs.writeFileSync(".clasp.json", JSON.stringify({scriptId:cfg.scriptId,rootDir:".gas-live"}));'
          printf '%s\n' 'node_modules/**' '.github/**' > .claspignore
          npx -y @google/clasp@3.4.1 pull

      - name: Overlay member-number reminder only
        shell: bash
        run: |
          test -f .gas-live/99_Main.js || (echo "Live 99_Main.js was not pulled" && exit 1)
          grep -R -q 'function getMpgMemberMasterSheet_' .gas-live || (echo "MPG member master helper is missing from live source" && exit 1)
          grep -R -q 'function normalizeMpgEmail_' .gas-live || (echo "MPG email helper is missing from live source" && exit 1)
          cp gas/93_MpgMemberNumberReminder.gs .gas-live/93_MpgMemberNumberReminder.js
          node <<'NODE'
          const fs = require("fs");
          const path = ".gas-live/99_Main.js";
          let src = fs.readFileSync(path, "utf8");
          if (!src.includes('case "sendMpgMemberNumberReminder"')) {
            const needle = `      case "verifyMpgSuspensionMember":
        return verifyMpgSuspensionMember_(
          body
        );`;
            if (!src.includes(needle)) throw new Error("verifyMpgSuspensionMember dispatch point not found in live 99_Main.js");
            const insert = `      case "sendMpgMemberNumberReminder":
        return sendMpgMemberNumberReminder_(
          body
        );

${needle}`;
            src = src.replace(needle, insert);
            fs.writeFileSync(path, src);
          }
          NODE

      - name: Verify overlay
        shell: bash
        run: |
          grep -q 'function sendMpgMemberNumberReminder_' .gas-live/93_MpgMemberNumberReminder.js
          grep -q 'case "sendMpgMemberNumberReminder"' .gas-live/99_Main.js
          grep -q 'CacheService.getScriptCache' .gas-live/93_MpgMemberNumberReminder.js
          echo "MPG member-number reminder overlay verified."

      - name: Push preserved live source plus reminder
        run: npx -y @google/clasp@3.4.1 push --force

      - name: Update existing web-app deployment
        shell: bash
        run: |
          DEPLOYMENT_ID="$(node - <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("assets/js/reserve.js", "utf8");
          const match = src.match(/script\.google\.com\/macros\/s\/([^/]+)\/exec/);
          if (!match) throw new Error("Could not resolve the current web-app deployment ID");
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$DEPLOYMENT_ID"
          npx -y @google/clasp@3.4.1 update-deployment "$DEPLOYMENT_ID" -d "MPG member number email reminder"

      - name: Smoke test public endpoint
        shell: bash
        run: |
          API="$(node - <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("assets/js/reserve.js", "utf8");
          const match = src.match(/https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/);
          if (!match) throw new Error("API URL not found");
          process.stdout.write(match[0]);
          NODE
          )"
          BODY='{"action":"sendMpgMemberNumberReminder","email":"mpg-member-number-smoke@example.invalid"}'
          curl -fsSL --max-time 60 -H 'Content-Type: text/plain;charset=utf-8' -d "$BODY" "$API" | tee /tmp/result.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("/tmp/result.json","utf8")); if(r.ok!==true) { console.error(r); process.exit(1); }'
          echo "Public endpoint smoke test OK."


      - name: Record successful deployment
        shell: bash
        run: |
          printf '%s\n' "MPG member-number reminder deployed successfully" > mpg-member-number-deploy-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mpg-member-number-deploy-ok.txt
          git commit -m "Record MPG member-number deployment success"
          git push
