name: GAS Diagnose Deployments

on:
  push:
    paths:
      - ".github/workflows/gas-diagnose-deployments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate clasp secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON is missing" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON is missing" && exit 1)

      - name: Setup clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: List Apps Script deployments
        run: |
          echo "=== CLASP DEPLOYMENTS ==="
          npx -y @google/clasp@3.4.1 deployments
