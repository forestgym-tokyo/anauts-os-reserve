name: Recover stale Pages deployment
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Pages deployment ID reported as blocking a new release'
        required: true
        type: string
permissions:
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PAGES_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            const id = process.env.PAGES_DEPLOYMENT_ID;
            if (!/^[a-f0-9]{40}$|^\d+$/.test(id)) throw new Error('Invalid Pages deployment ID');
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                ...context.repo, pages_deployment_id: id
              });
            } catch (error) {
              if (!String(error.message).includes("as it's finished")) throw error;
              core.info('The previous deployment has already finished.');
            }
            await github.request('POST /repos/{owner}/{repo}/pages/builds', context.repo);
            core.info('Requested a fresh build of the configured Pages branch.');
