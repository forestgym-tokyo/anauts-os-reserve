<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Forest Gym | 精算内容の確認・承認</title>
<style>
:root{--bg:#07100c;--panel:#101a15;--line:#26382f;--text:#f6faf7;--muted:#9eb0a6;--green:#63d179;--green2:#2fa85d;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -100px,rgba(99,209,121,.16),transparent 360px),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.65;padding:24px 12px 56px}.wrap{max-width:620px;margin:auto}.brand{margin:4px 0 24px;text-align:center}.mark{width:68px;height:68px;border:2px solid var(--green);border-radius:18px;margin:auto;display:grid;place-items:center;font-weight:950;font-size:26px;color:var(--green)}h1{font-size:27px;margin:12px 0 3px}.sub{font-size:10px;letter-spacing:2px;color:var(--muted)}.card{background:rgba(16,26,21,.96);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:1.6px}.member{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{background:#0b1510;border:1px solid #203229;border-radius:13px;padding:12px}.kv small{display:block;color:var(--muted);font-size:10px}.kv strong{display:block;margin-top:3px;font-size:15px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:10px 6px;border-bottom:1px solid #21332a;font-size:12px}.table th{color:var(--muted);font-weight:700;text-align:left}.num{text-align:right;white-space:nowrap}.total{margin-top:16px;background:linear-gradient(135deg,#153d2a,#0f2d20);border:1px solid rgba(99,209,121,.55);border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:end}.total span{color:#cfe5d8;font-size:12px}.total strong{font-size:30px;color:#fff}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#cdd8d1;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #31473b;background:#08110c;color:#fff;font-size:16px}.check{display:flex;gap:11px;align-items:flex-start;margin:15px 0}.check input{width:22px;height:22px;min-width:22px;margin-top:2px;accent-color:var(--green2)}.check label{font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:16px;background:linear-gradient(135deg,#2b9f58,#69db83);color:#041008;font-weight:950;font-size:17px;cursor:pointer}.btn:disabled{opacity:.45}.msg{margin-top:12px;font-size:13px}.ok{color:#7ee39a}.error{color:#ff8585}.hidden{display:none!important}.done{text-align:center;padding:26px}.done h2{color:#7ee39a}.note{font-size:11px;color:var(--muted)}@media(max-width:520px){.member{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}.card{padding:17px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><div class="mark">TFG</div><h1>精算内容の確認・承認</h1><div class="sub">SETTLEMENT CONFIRMATION</div></header>
  <div id="loading" class="card">精算内容を確認しています…</div>
  <div id="main" class="hidden">
    <section class="card">
      <div class="eyebrow">MEMBER</div>
      <h2 style="margin:4px 0 14px;font-size:18px">会員情報</h2>
      <div class="member">
        <div class="kv"><small>お名前</small><strong id="memberName">—</strong></div>
        <div class="kv"><small>退会予定</small><strong id="withdrawalDate">—</strong></div>
      </div>
    </section>
    <section class="card">
      <div class="eyebrow">DETAIL</div><h2 style="margin:4px 0 8px;font-size:18px">精算内訳</h2>
      <div style="overflow:auto"><table class="table"><thead><tr><th>対象</th><th>内容</th><th class="num">決済額</th><th class="num">通常価格</th><th class="num">精算額</th></tr></thead><tbody id="items"></tbody></table></div>
      <div class="total"><span>今回のご精算金額</span><strong id="total">—</strong></div>
      <p class="note">精算内容に相違がある場合は承認せず、The Forest Gymへお問い合わせください。</p>
    </section>
    <section class="card">
      <div class="eyebrow">IDENTITY</div><h2 style="margin:4px 0 8px;font-size:18px">ご本人確認</h2>
      <div class="field"><label>会員番号</label><input id="memberNo" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label>登録メールアドレス</label><input id="email" type="email" autocomplete="email"></div>
    </section>
    <section class="card">
      <div class="eyebrow">CONSENT</div><h2 style="margin:4px 0 8px;font-size:18px">確認事項</h2>
      <div class="check"><input id="c1" type="checkbox"><label for="c1">上記の精算内容および精算金額を確認しました。</label></div>
      <div class="check"><input id="c2" type="checkbox"><label for="c2">表示された精算金額が一括決済されることに同意します。</label></div>
      <div class="check"><input id="c3" type="checkbox"><label for="c3">決済が完了しない場合、退会手続きが完了しないことを理解しました。</label></div>
      <button id="approve" class="btn">上記内容に同意して承認する</button>
      <div id="message" class="msg"></div>
    </section>
  </div>
  <section id="done" class="card done hidden"><h2>承認が完了しました</h2><p>精算内容への承認を受け付けました。</p><p id="approvedAt" class="note"></p></section>
</div>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyvpQRxRpMRfpaQHtBar77dViCqPl-hdFW-2yMdozhN8RHtwcrFiNEM9cvEbny4x9q0/exec";
const token=new URLSearchParams(location.search).get("token")||"";
const $=id=>document.getElementById(id); let settlement=null;
const yen=n=>Number(n||0).toLocaleString("ja-JP")+"円";
async function api(payload){const r=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function load(){try{if(!token)throw new Error("承認URLが正しくありません。");const d=await api({action:"getTfgSettlement",token});if(!d.ok)throw new Error(d.message||"精算内容を取得できませんでした。");settlement=d.data;if(settlement.status==="APPROVED"){showDone(settlement.approvedAt);return}$("memberName").textContent=settlement.memberName+" 様";$("withdrawalDate").textContent=settlement.withdrawalDate||"—";$("total").textContent=yen(settlement.total);$("items").innerHTML=(settlement.items||[]).map(x=>`<tr><td>${esc(x.target||"—")}</td><td>${esc(x.label||"")}</td><td class="num">${yen(x.paid)}</td><td class="num">${yen(x.normal)}</td><td class="num"><strong>${yen(x.settlement)}</strong></td></tr>`).join("");$("loading").classList.add("hidden");$("main").classList.remove("hidden")}catch(e){$("loading").textContent=e.message;$("loading").classList.add("error")}}
function esc(v){return String(v).replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]))}
function showDone(at){$("loading").classList.add("hidden");$("main").classList.add("hidden");$("done").classList.remove("hidden");$("approvedAt").textContent=at?"承認日時："+at:""}
$("approve").addEventListener("click",async()=>{const btn=$("approve"),msg=$("message");msg.className="msg";msg.textContent="";if(!$("c1").checked||!$("c2").checked||!$("c3").checked){msg.classList.add("error");msg.textContent="確認事項3項目すべてへの同意が必要です。";return}btn.disabled=true;btn.textContent="承認処理中…";try{const d=await api({action:"approveTfgSettlement",token,memberNo:$("memberNo").value.trim(),email:$("email").value.trim(),consent1:true,consent2:true,consent3:true});if(!d.ok)throw new Error(d.message||"承認できませんでした。");showDone(d.data&&d.data.approvedAt)}catch(e){msg.classList.add("error");msg.textContent=e.message;btn.disabled=false;btn.textContent="上記内容に同意して承認する"}});
load();
</script>
</body></html>
