<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>予約の変更・キャンセル | 9ROUND アリオ蘇我店</title>
  <style>
    :root { color-scheme:light; font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; background:#f5f5f6;color:#161616; }
    body { margin:0; } header { background:#151515;color:#fff;padding:20px 16px;font-weight:800;letter-spacing:.06em; }
    header b { color:#ee2a3a; } main { max-width:570px;margin:28px auto;padding:0 16px 36px; }
    h1 { font-size:1.45rem;line-height:1.5; } h2 { font-size:1.1rem; }
    .panel { background:#fff;border:1px solid #dedee1;border-radius:12px;padding:22px;margin:18px 0; }
    .hint { color:#555;line-height:1.65; } .details { line-height:1.9;white-space:pre-line;font-size:1.05rem;font-weight:600; }
    button { display:block;width:100%;padding:14px 16px;margin:12px 0;border:1px solid #333;border-radius:8px;font:inherit;font-weight:650;cursor:pointer;background:white;color:#111; }
    button.primary { background:#e52535;border-color:#e52535;color:#fff; }
    button:disabled { cursor:not-allowed;opacity:.5; }
    input[type=date] { box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border:1px solid #aaa;border-radius:8px;font:inherit; }
    .status { white-space:pre-line;line-height:1.65; } .status.error { color:#ad1530; }
    [hidden] { display:none!important; }
    footer { font-size:.85rem;color:#555;margin-top:26px; }
  </style>
  <script src="./config.js" defer></script>
  <script src="./api.js?v=20261024-nov30" defer></script>
  <script src="./link-actions.js" defer></script>
</head>
<body>
  <header><b>9</b>ROUND <small>ARIO SOGA</small></header>
  <main>
    <h1>ワークアウト予約の変更・キャンセル</h1>
    <p class="hint">予約確認メールの専用リンクから操作できます。6桁の確認コードや再ログインは不要です。変更・キャンセルは開始1時間前までです。</p>
    <section class="panel" aria-live="polite">
      <p id="status" class="status">予約を確認しています…</p>
      <div id="reservation" hidden>
        <h2>対象の予約</h2><p id="reservationInfo" class="details"></p>
        <div id="actions" hidden>
          <button id="cancelBooking" class="primary" type="button">この予約をキャンセルする</button>
          <button id="chooseChange" type="button">予約日時を変更する</button>
        </div>
        <div id="changeArea" hidden>
          <label for="changeDate">変更先の日付</label>
          <input type="date" id="changeDate" required>
          <p class="hint">空いている開始時刻をタップすると変更が確定します。</p>
          <div id="availableSlots" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <p class="hint">この画面を開くだけでは予約は変更・キャンセルされません。操作が完了すると確認メールをお送りします。</p>
    <footer>9ROUND アリオ蘇我店</footer>
  </main>
</body>
</html>
