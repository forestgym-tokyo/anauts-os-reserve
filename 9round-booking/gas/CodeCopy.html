<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;line-height:1.8;padding:28px 18px}main{max-width:420px;margin:auto}.brand{font-size:28px;font-weight:900;letter-spacing:-1px}.brand b{color:#e52535}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#bbb}section{margin-top:28px;background:#202024;border:1px solid #46464c;border-radius:16px;padding:24px}h1{font-size:21px;margin-top:0}input{width:100%;text-align:center;font-size:30px;font-weight:bold;letter-spacing:7px;padding:16px 8px;background:#fff;color:#111;border:0;border-radius:8px}button,a{display:block;width:100%;border-radius:8px;text-align:center;font-size:15px;font-weight:bold;padding:15px;margin-top:18px}button{background:#e52535;color:#fff;border:0;cursor:pointer}a{color:#fff;background:#333;text-decoration:none}p{font-size:13px;color:#ccc}#status{min-height:24px;color:#b5efcc}.error{color:#ffb5bd}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}
</style></head><body><main><div class="brand"><b>9</b>ROUND<small>ARIO SOGA</small></div><section>
<? if (code) { ?>
<h1>確認コードをコピー</h1><input id="copyCode" aria-label="6桁の確認コード" type="text" value="<?= code ?>" readonly autocomplete="off"><button id="copyButton" type="button">コピーする</button><p id="status" role="status" aria-live="polite"></p><p>コピー後、元の予約画面に戻り、確認コードの入力欄に貼り付けてください。有効期限はメール送信から10分です。</p>
<p>この画面を閉じて、確認コードを送信した元の予約画面へお戻りください。</p>
<script>document.querySelector('#copyButton').addEventListener('click',async function(){const input=document.querySelector('#copyCode'),status=document.querySelector('#status');let copied=false;try{await navigator.clipboard.writeText(input.value);copied=true;}catch(_){input.focus();input.select();input.setSelectionRange(0,input.value.length);try{copied=document.execCommand('copy');}catch(_) {}}status.textContent=copied?'コピーしました。元の予約画面に戻って貼り付けてください。':'数字を長押し、または選択してコピーしてください。';if(copied)this.textContent='コピーしました ✓';});</script>
<? } else { ?><h1>確認コードを確認できません</h1><p class="error"><?= errorMessage ?></p><p>元の予約画面に戻り、確認コードを再送してください。</p><? } ?>
</section></main></body></html>
