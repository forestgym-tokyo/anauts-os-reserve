<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="referrer" content="no-referrer">
  <title>予約管理 | 9ROUND アリオ蘇我店</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="../config.js" defer></script>
  <script src="../api.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="../vendor/jsqr.min.js" defer></script>
  <script src="./scanner.js" defer></script>
  <script src="./booking-actions.js" defer></script>
  <script src="./trials.js" defer></script>
  <script src="./board.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand" aria-label="9ROUND"><span>9</span>ROUND<small>ARIO SOGA</small></div>
    <span class="header-label">STAFF BOOKING</span>
  </header>
  <main style="max-width:1000px">
    <section class="intro"><p class="eyebrow"><span></span> WORKOUT MANAGEMENT</p><h1>ワークアウト予約管理</h1><p class="intro-copy">予約確認 / 会員QRで受講登録 / ブロック / 体験枠</p></section>
    <div id="staffAuthBar" class="verified-bar" style="margin:20px 0" hidden><span>スタッフとしてログイン中</span><button id="staffLogout" class="text-button" type="button">ログアウト</button></div>
    <div id="staffLoginMessage" class="message" role="status" aria-live="polite" hidden></div>
    <section id="staffLoginPanel" class="panel" style="margin-top:24px">
      <h2>スタッフログイン</h2><p class="hint">A-nautsでお使いのスタッフアカウントでログインしてください。</p>
      <form id="staffLoginForm">
        <label for="staffEmail">メールアドレス</label><input id="staffEmail" type="email" autocomplete="username" maxlength="254" required>
        <label for="staffPassword" style="margin-top:16px">パスワード</label><input id="staffPassword" type="password" autocomplete="current-password" required>
        <button id="staffSignIn" class="primary" type="submit">ログイン →</button>
      </form>
    </section>
    <div id="staffWorkspace" style="margin-top:24px"></div>
    <p class="footer-note">9ROUND アリオ蘇我店</p>
  </main>
</body>
</html>
