<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>入会画面の表示確認 | 9ROUND</title><style>
*{box-sizing:border-box}body{margin:0;background:#17202e;color:#e8eef9;font:14px system-ui,sans-serif}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid #35445e}h1{font-size:16px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button{min-height:42px;padding:8px 14px;background:#263a56;color:#cbdfff;border:1px solid #4b6490;border-radius:5px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#286cd5;color:white}a{color:#aacaff}.surface{overflow:auto;padding:20px;min-height:calc(100vh - 80px)}iframe{display:block;width:390px;max-width:none;height:1050px;margin:0 auto;border:1px solid #42536f;border-radius:9px;background:#080b12}p{font-size:12px;color:#aabbd5;line-height:1.7;margin:0}
</style></head><body><header><div><h1>入会画面の表示確認</h1><p>本番の入会画面を表示します。申込内容を送信すると、店舗のマスターに保存されます。</p></div><nav aria-label="画面幅"><button type="button" data-width="320" aria-pressed="false">幅320px</button><button type="button" data-width="390" aria-pressed="true">幅390px</button><button type="button" data-width="768" aria-pressed="false">幅768px</button><button type="button" data-width="1200" aria-pressed="false">幅1200px</button></nav><a href="../membership/">入会画面を開く ↗</a></header><main class="surface"><iframe src="../membership/" title="入会画面プレビュー"></iframe></main><script>
document.querySelectorAll('[data-width]').forEach(function(button){button.addEventListener('click',function(){document.querySelector('iframe').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(function(other){other.setAttribute('aria-pressed',String(other===button));});});});
</script></body></html>
