<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>店内見学アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="./assets/tour-questionnaire-front.png">
<link rel="preload" as="image" href="./assets/tour-questionnaire-back.png">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#d9ddda;color:#111;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.toolbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px;background:#111;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.toolbar strong{font-size:13px;font-weight:700}
.toolbar button{border:0;border-radius:999px;padding:10px 20px;background:#fff;color:#111;font:700 14px/1 "M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;cursor:pointer}
.page-wrap{padding:12px 0 24px}
.sheet{position:relative;width:min(210mm,calc(100vw - 20px));aspect-ratio:210/297;margin:0 auto 12px;background:#fff;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.18);page-break-after:always;break-after:page}
.sheet:last-child{margin-bottom:0;page-break-after:auto;break-after:auto}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.fill{position:absolute;z-index:3;color:#111;white-space:nowrap;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:500;font-size:min(2.7vw,10.5pt);line-height:1.22;letter-spacing:.01em}
.front-name{left:21.2%;top:13.8%;font-size:min(2.85vw,11pt);font-weight:500}
.front-postal{left:16.1%;top:17.05%}
.front-address{left:16.1%;top:19.15%;max-width:58%;white-space:normal}
.front-phone{left:22.8%;top:22.42%}
.front-email{left:22.0%;top:25.55%;font-size:min(2.62vw,10.2pt)}
.front-booking{left:8.3%;top:87.55%;font-size:min(2.64vw,10.3pt);font-weight:500}
.error{max-width:720px;margin:60px auto;padding:24px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.16);line-height:1.7}
@media(max-width:620px){
  .toolbar{justify-content:space-between}
  .toolbar strong{font-size:11px}
  .toolbar button{padding:9px 14px;font-size:13px}
  .page-wrap{padding-top:8px}
  .sheet{margin-bottom:8px}
}
@media print{
  html,body{width:210mm;background:#fff}
  .toolbar{display:none!important}
  .page-wrap{padding:0}
  .sheet{width:210mm;height:297mm;aspect-ratio:auto;margin:0;box-shadow:none;overflow:hidden}
  .fill{font-size:10.5pt}
  .front-name{font-size:11pt}
  .front-email{font-size:10.2pt}
  .front-booking{font-size:10.3pt}
  @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<div class="toolbar">
  <strong>A4・2ページ／両面は長辺とじ</strong>
  <button type="button" id="printButton">印刷・PDF保存</button>
</div>
<main class="page-wrap" id="pages" hidden>
  <section class="sheet" aria-label="アンケート1ページ目">
    <img class="base" src="./assets/tour-questionnaire-front.png" alt="アンケート表面">
    <div class="fill front-name" data-field="name"></div>
    <div class="fill front-postal" data-field="postal"></div>
    <div class="fill front-address" data-field="address"></div>
    <div class="fill front-phone" data-field="phone"></div>
    <div class="fill front-email" data-field="email"></div>
    <div class="fill front-booking" data-field="visit_datetime"></div>
  </section>
  <section class="sheet" aria-label="アンケート2ページ目">
    <img class="base" src="./assets/tour-questionnaire-back.png" alt="アンケート裏面">
  </section>
</main>
<div class="error" id="errorBox" hidden></div>
<script>
(function(){
  "use strict";

  function decodePayload(){
    const raw=String(location.hash||"").replace(/^#/,"").trim();
    if(!raw)throw new Error("アンケート情報がありません。管理画面から開き直してください。");
    const base64=raw.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-raw.length%4)%4);
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  function render(){
    try{
      const data=decodePayload();
      if(history&&history.replaceState){
        history.replaceState(null,"",location.pathname+location.search);
      }
      document.querySelectorAll("[data-field]").forEach(function(node){
        const key=node.getAttribute("data-field");
        node.textContent=String(data[key]||"");
      });
      const cleanName=String(data.name||"").replace(/\s*さま$/," ").trim();
      document.title=(data.service_code==="COUNSEL"?"カウンセリングアンケート":"店内見学アンケート")+(cleanName?" - "+cleanName:"");
      document.getElementById("pages").hidden=false;
    }catch(error){
      const box=document.getElementById("errorBox");
      box.textContent=error&&error.message?error.message:"アンケートを表示できませんでした。";
      box.hidden=false;
    }
  }

  document.getElementById("printButton").addEventListener("click",function(){
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(function(){window.print();});
      return;
    }
    window.print();
  });

  render();
})();
</script>
</body>
</html>
