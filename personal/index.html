<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>パーソナルトレーニング予約 | The Forest Gym</title>
  <link rel="stylesheet" href="../assets/css/reserve.css">
</head>
<body>
<main class="page">
  <header>
    <p class="eyebrow">A-nauts OS Reserve</p>
    <h1>パーソナルトレーニング予約</h1>
    <p class="lead">プランを選択し、7日分の空き時間からご希望の日時をお選びください。</p>
  </header>

  <section class="card">
    <div class="step"><span class="step-num">1</span><h2>ご利用プラン</h2></div>
    <div id="planGrid" class="plan-grid"></div>
  </section>

  <section id="availabilitySection" class="card is-hidden">
    <div class="step"><span class="step-num">2</span><h2>日時を選択</h2></div>
    <div class="week-toolbar">
      <button id="prevWeekButton" class="week-button" type="button">‹ 前の週</button>
      <strong id="weekRange" class="week-range"></strong>
      <button id="nextWeekButton" class="week-button" type="button">次の週 ›</button>
    </div>
    <button id="reloadButton" class="button button-secondary" type="button">空き状況を更新</button>
    <p id="weekStatus" class="status" aria-live="polite"></p>
    <div id="weekList" class="week-list"></div>
  </section>

  <section id="customerSection" class="card is-hidden">
    <div class="step"><span class="step-num">3</span><h2>会員情報</h2></div>
    <div class="selected"><span>選択中</span><strong id="selectedSlotText"></strong></div>
    <form id="reservationForm" novalidate>
      <label class="field"><span>会員番号</span><input id="memberNo" type="text" placeholder="例：108035" required></label>
      <label class="field"><span>登録メールアドレス</span><input id="customerEmail" type="email" placeholder="example@gmail.com" required></label>
      <label class="field"><span>電話番号</span><input id="customerPhone" type="tel" inputmode="tel" placeholder="09012345678"><small>会員番号と登録メールで照合します。</small></label>
      <label class="field"><span>ご要望・備考</span><textarea id="note" rows="4"></textarea></label>
      <div id="formError" class="alert alert-error is-hidden" role="alert"></div>
      <button id="submitButton" class="button button-primary" type="submit">この内容で予約する</button>
    </form>
  </section>

  <section id="completeSection" class="card complete is-hidden">
    <div class="complete-mark">✓</div>
    <h2>予約が完了しました</h2>
    <p id="completeSummary"></p>
    <p>予約番号：<strong id="reservationId"></strong></p>
    <button id="newReservationButton" class="button button-secondary" type="button">別の予約をする</button>
  </section>
</main>
<script src="../assets/js/personal.js" defer></script>
</body>
</html>
